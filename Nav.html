<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; padding: 16px clamp(20px, 4vw, 48px); background: rgba(252,250,244,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid #E4DFD2; font-family: 'Nunito', sans-serif;">
  <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
    <div style="width: 40px; height: 40px; background: #2E7D5B; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 900 17px 'Nunito';">L</div>
    <div style="display: flex; flex-direction: column;">
      <span style="font: 900 21px/1 'Nunito'; color: #1F3327;">leila</span>
      <span style="font: 700 10px 'Nunito'; letter-spacing: 1px; color: #7D8C81;">FOYER · SAJ · SAVS · EMP — STAINS</span>
    </div>
  </a>
  <div style="display: flex; flex-wrap: wrap; gap: 4px; font: 800 14px 'Nunito';">
    <a href="index.html" style="text-decoration: none; color: #1F3327; padding: 9px 16px; border-radius: 999px; background: {{ bAccueil }}; transition: background 0.3s;" style-hover="background: #EAF3EC;">Accueil</a>
    <a href="association.html" style="text-decoration: none; color: #1F3327; padding: 9px 16px; border-radius: 999px; background: {{ bAssociation }}; transition: background 0.3s;" style-hover="background: #EAF3EC;">L'asso</a>
    <a href="foyer.html" style="text-decoration: none; color: #1F3327; padding: 9px 16px; border-radius: 999px; background: {{ bFoyer }}; transition: background 0.3s;" style-hover="background: #EAF3EC;">Foyer</a>
    <a href="saj.html" style="text-decoration: none; color: #1F3327; padding: 9px 16px; border-radius: 999px; background: {{ bSaj }}; transition: background 0.3s;" style-hover="background: #EAF3EC;">SAJ</a>
    <a href="savs.html" style="text-decoration: none; color: #1F3327; padding: 9px 16px; border-radius: 999px; background: {{ bSavs }}; transition: background 0.3s;" style-hover="background: #EAF3EC;">SAVS</a>
    <a href="emp.html" style="text-decoration: none; color: #1F3327; padding: 9px 16px; border-radius: 999px; background: {{ bEmp }}; transition: background 0.3s;" style-hover="background: #EAF3EC;">EMP</a>
    <a href="actualites.html" style="text-decoration: none; color: #1F3327; padding: 9px 16px; border-radius: 999px; background: {{ bActualites }}; transition: background 0.3s;" style-hover="background: #EAF3EC;">Actus</a>
    <a href="contact.html" style="text-decoration: none; color: #1F3327; padding: 9px 16px; border-radius: 999px; background: {{ bContact }}; transition: background 0.3s;" style-hover="background: #EAF3EC;">Contact</a>
  </div>
  <a href="candidater.html" style="text-decoration: none; background: #F2994A; color: #fff; font: 800 14px 'Nunito'; padding: 11px 22px; border-radius: 999px; transition: transform 0.3s, background 0.3s;" style-hover="transform: scale(1.05); background: #E0873A;">Candidater</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1400px&quot;,&quot;height&quot;:&quot;76px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;accueil&quot;,&quot;association&quot;,&quot;foyer&quot;,&quot;saj&quot;,&quot;savs&quot;,&quot;emp&quot;,&quot;actualites&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;accueil&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || '';
    const b = (k) => (k === active ? '#EAF3EC' : 'transparent');
    return {
      bAccueil: b('accueil'),
      bAssociation: b('association'),
      bFoyer: b('foyer'),
      bSaj: b('saj'),
      bSavs: b('savs'),
      bEmp: b('emp'),
      bActualites: b('actualites'),
      bContact: b('contact'),
    };
  }
}
</script>
</body>
</html>
